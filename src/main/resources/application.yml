spring:
  application:
    name: prism-Backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/prism}
    username: ${DB_USERNAME:Prism}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: true

server:
  port: 8080

prism:
  services:
    slither-base-url: ${SLITHER_SERVICE_URL:http://localhost:8001}
    ml-base-url: ${ML_SERVICE_URL:http://localhost:8002}
  chain:
    rpc-url: http://localhost:8545
  alerts:
    default-threshold: 85
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
  auth:
    jwt-secret: ${JWT_SECRET_KEY}
    jwt-expiry-minutes: 720
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  static-analyzer:
    build: ./backend-services/static-analyzer
    restart: unless-stopped
    # .env is excluded from the image (.dockerignore), so without this the analyzer's
    # GEMINI_* / timeout settings were silently ignored inside Docker.
    env_file:
      - path: ./backend-services/static-analyzer/.env
        required: false
    environment:
      # Discrete parts (not a URL) so any password character is safe.
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: prism_static_analyzer
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ALLOWED_ORIGINS: https://prism-1dg.pages.dev
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  hardhat-node:
    build: ./blockchain-env
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_blockNumber',params:[]})}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./prism-Backend
    restart: unless-stopped
    env_file:
      - ./prism-Backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      static-analyzer:
        condition: service_healthy
      hardhat-node:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"

  # Optional: start with `docker compose --profile ml up --build` once ml/ has produced
  # ml-service/model/. Then set ML_ENABLED=true and ML_SERVICE_URL=http://ml-service:8002
  # in prism-Backend/.env. Without the profile the backend uses the rule-based baseline.
  ml-service:
    profiles: ["ml"]
    build: ./ml-service
    restart: unless-stopped
    expose:
      - "8002"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
